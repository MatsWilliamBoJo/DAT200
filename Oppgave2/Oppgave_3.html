<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <title>Squares</title>

    <style>
        body {
            background-color: #202938;
            margin: 20px;
        }

        canvas {
            background-color: white;
        }
    </style>
</head>

<body>

<canvas id="canvas" width="800" height="800"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.strokeStyle = "black";
ctx.lineWidth = 1;


// Square drawing function
function drawSquare(x, y, size, mirrored) {

    ctx.save();

    // Flytt til riktig firkant
    ctx.translate(x, y);

    // Speilvend annenhver firkant
    if (mirrored) {
        ctx.translate(size, 0);
        ctx.scale(-1, 1);
    }


    // corner points of the first square
    let x1 = 0;
    let y1 = 0;

    let x2 = size;
    let y2 = 0;

    let x3 = size;
    let y3 = size;

    let x4 = 0;
    let y4 = size;


    // Draw squares inside squares
    for (let i = 0; i < 35; i++) {

        // Draw the square
        ctx.beginPath();

        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.lineTo(x4, y4);
        ctx.closePath();

        ctx.stroke();


        // How much each corner moves
        const move = 0.08;

        // Find new corners
        const newX1 = x1 + (x2 - x1) * move;
        const newY1 = y1 + (y2 - y1) * move;

        const newX2 = x2 + (x3 - x2) * move;
        const newY2 = y2 + (y3 - y2) * move;

        const newX3 = x3 + (x4 - x3) * move;
        const newY3 = y3 + (y4 - y3) * move;

        const newX4 = x4 + (x1 - x4) * move;
        const newY4 = y4 + (y1 - y4) * move;

        // Replace old corners
        x1 = newX1;
        y1 = newY1;

        x2 = newX2;
        y2 = newY2;

        x3 = newX3;
        y3 = newY3;

        x4 = newX4;
        y4 = newY4;
    }

    ctx.restore();
}


// Draw 4 x 4 pattern
function draw() {

    const size = 200;

    for (let row = 0; row < 4; row++) {

        for (let col = 0; col < 4; col++) {

            const x = col * size;
            const y = row * size;

            // Mirrored every other square
            const mirrored = (row + col) % 2 === 1;

            drawSquare(x, y, size, mirrored);
        }
    }
}


draw();

</script>

</body>

</html>
