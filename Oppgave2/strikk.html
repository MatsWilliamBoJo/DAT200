<!DOCTYPE html>
<html lang="no">
<head>
    <title>Strikk</title>
</head>
<body>

<canvas id="myCanvas" width="500" height="500"></canvas>

<script>
    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");

    // Start posision for center
    var centerX = 250;
    var centerY = 250;

    var dragging = false;

    // How close the mouse must be to the center
    var radius = 9;


    function draw() {
        // Clear the canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "yellow";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Red square
        ctx.fillStyle = "red";
        ctx.fillRect(100, 100, 300, 300);

        // First part of the rubber band
        ctx.beginPath();
        ctx.moveTo(100, 250);
        ctx.lineTo(centerX, centerY);
        ctx.strokeStyle = "black";
        ctx.stroke();

        // Second part of the rubber band
        ctx.beginPath();
        ctx.moveTo(400, 250);
        ctx.lineTo(centerX, centerY);
        ctx.strokeStyle = "black";
        ctx.stroke();

        // Circle in the middle
        ctx.beginPath();
        ctx.arc(centerX, centerY, 5, 0, 2 * Math.PI);
        ctx.fillStyle = "black";
        ctx.fill();
    }


    // When the mouse is pressed down
    canvas.addEventListener("mousedown", function(e) {

        let currx = e.clientX - canvas.offsetLeft;
        let curry = e.clientY - canvas.offsetTop;

        // Find the distance from the mouse to the center
        let dx = currx - centerX;
        let dy = curry - centerY;
        let distance = Math.sqrt(dx * dx + dy * dy);

        // If the mouse is close to the center
        if (distance <= radius) {
            dragging = true;
            canvas.style.cursor = "pointer";
        }

    }, false);

    // When the mouse is moved
    canvas.addEventListener("mousemove", function(e) {

        let currx = e.clientX - canvas.offsetLeft;
        let curry = e.clientY - canvas.offsetTop;

        // Find the distance from the mouse to the center
        let dx = currx - centerX;
        let dy = curry - centerY;
        let distance = Math.sqrt(dx * dx + dy * dy);

        // If the user is dragging the rubber band
        if (dragging) {
            centerX = currx;
            centerY = curry;
            canvas.style.cursor = "pointer";
            draw();
        }
        // If the user is not dragging, check if the mouse is close to the center
        else if (distance <= radius) {
            canvas.style.cursor = "pointer";
        }
        else {
            canvas.style.cursor = "auto";
        }
    }, false);


    // When the mouse button is released
    canvas.addEventListener("mouseup", function(e) {
        dragging = false;
        // Reset the rubber band to the original position
        centerX = 250;
        centerY = 250;
        canvas.style.cursor = "auto";
        draw();
    }, false);

    // Draw the image for the first time
    draw();
</script>

</body>
</html>
